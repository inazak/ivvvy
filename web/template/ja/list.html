{{template "layout" .}}
{{define "content"}}
<section>
  <h1>全ページ一覧</h1>
  {{if .Pages}}
  <ul class="page-list">
    {{range .Pages}}
    <li>
      <span class="page-id-small">{{.ID}}</span>
      <a href="/page/{{.ID}}">{{.Title}}</a>
      <time>{{.UpdatedAt.Format "2006-01-02 15:04"}}</time>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty">ページがありません。</p>
  {{end}}
</section>
{{end}}
