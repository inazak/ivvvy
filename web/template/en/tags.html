{{template "layout" .}}
{{define "content"}}
<section>
  <h1>Tags</h1>
  {{if .TagCounts}}
  <div class="tag-cloud">
    {{range .TagCounts}}
    <a href="/tags/{{.Name}}" class="tag-chip">{{.Name}}<span class="tag-count">{{.Count}}</span></a>
    {{end}}
  </div>
  {{else}}
  <p class="empty">No tags.</p>
  {{end}}
</section>
{{end}}
